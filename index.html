<!doctype html>
<html lang="en" data-theme="dark" data-accent="neutral">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/maianewlogo.svg" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Fonts are self-hosted via @fontsource-variable and bundled by Vite,
       so font-src is 'self' — no external font CDN. -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src * data: blob:; connect-src *;" />

  <title>Maia</title>
  <!-- Sets data-theme / data-accent before first paint (see public/theme-boot.js). -->
  <script src="/theme-boot.js"></script>
</head>

<body>
  <div id="root" class="h-full"></div>

  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
